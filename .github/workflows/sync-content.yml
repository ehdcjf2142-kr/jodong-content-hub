name: Sync content

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # YOUTUBE_API_KEY (선택, 없으면 RSS fallback):
      # 1. GitHub repo → Settings → Secrets and variables → Actions
      # 2. New repository secret. Name = YOUTUBE_API_KEY, Value = YouTube Data API v3 키
      # 3. 아래 ${{ secrets.YOUTUBE_API_KEY }} 가 그 값을 이 step 의 env 로 주입한다.
      - name: Sync from YouTube + RSS
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_HANDLE: JodongBroOfficial
          SYNC_MAX_VIDEOS: 20
          SYNC_MAX_BLOG: 10
        run: npm run sync:content

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/
          if git diff --staged --quiet; then
            echo "No content changes"
          else
            git commit -m "chore: sync content from YouTube and blogs"
            git push
          fi
